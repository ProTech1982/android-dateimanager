name: APK bauen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Signierte APK bauen und veroeffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Das Secret KEYSTORE_B64 fehlt. Ohne festen Schlüssel lässt sich keine Aktualisierung über eine bestehende Installation legen."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/dateimanager.jks

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dateimanager' }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Dateimanager.apk
          version=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          changes=$(git log -1 --pretty=%s)
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

      - name: Als Download bereitstellen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dateimanager ${{ steps.apk.outputs.version }} (Build ${{ github.run_number }})
          body: |
            Version ${{ steps.apk.outputs.version }}, Build ${{ github.run_number }}.

            Änderungen in diesem Build:
            ${{ steps.apk.outputs.changes }}

            Unten auf **Dateimanager.apk** tippen, herunterladen und öffnen.
          files: out/Dateimanager.apk

      - name: Auch als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: dateimanager-apk
          path: out/Dateimanager.apk
          if-no-files-found: error
