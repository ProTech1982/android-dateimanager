name: APK bauen

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: APK bauen und veroeffentlichen
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Dateimanager.apk
          version=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          changes=$(git log -1 --pretty=%s)
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

      - name: Als Download bereitstellen
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dateimanager ${{ steps.apk.outputs.version }} (Build ${{ github.run_number }})
          body: |
            Version ${{ steps.apk.outputs.version }}, Build ${{ github.run_number }}.

            Änderungen in diesem Build:
            ${{ steps.apk.outputs.changes }}

            Unten auf **Dateimanager.apk** tippen, herunterladen und öffnen.
          files: out/Dateimanager.apk

      - name: Auch als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: dateimanager-apk
          path: out/Dateimanager.apk
          if-no-files-found: error
